name: Monitor de webs

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci --omit=dev --no-audit --no-fund

      - name: Revisar webs y avisar por mail
        run: node monitor.mjs
        env:
          SITES_JSON: ${{ secrets.SITES_JSON }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}

      - name: Guardar estado
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "rotundo-monitor"
            git config user.email "monitor@users.noreply.github.com"
            git add state.json
            git commit -m "Actualizar estado"
            git pull --rebase
            git push
          fi
