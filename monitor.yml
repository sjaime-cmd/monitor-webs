name: Monitor de webs

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci --omit=dev --no-audit --no-fund

      - name: Recuperar estado anterior
        run: |
          if git ls-remote --exit-code --heads origin status >/dev/null 2>&1; then
            git fetch -q origin status
            git show FETCH_HEAD:status.json > state.json || echo '{}' > state.json
          else
            echo '{}' > state.json
          fi

      - name: Revisar webs y avisar por mail
        run: node monitor.mjs
        env:
          SITES_JSON: ${{ secrets.SITES_JSON }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}

      - name: Publicar estado para el dashboard
        run: |
          mkdir -p /tmp/pub
          cp state.json /tmp/pub/status.json
          cd /tmp/pub
          git init -q -b status
          git config user.name "rotundo-monitor"
          git config user.email "monitor@users.noreply.github.com"
          git add status.json
          git commit -q -m "Estado $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" status
